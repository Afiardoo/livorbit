<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 662" width="790" height="662" ><title>livorbit animated symbol</title><desc>One orbit reveal and one pulse, complete in 1.55 seconds; respects reduced motion.</desc><style>
.orbit-reveal{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s ease-out 1}
.pulse{transform-origin:660px 405px;animation:beat .55s ease-in-out 1s 1}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@media(prefers-reduced-motion:reduce){.orbit-reveal,.pulse{animation:none}}
</style><defs><mask id="reveal" maskUnits="userSpaceOnUse" x="400" y="180" width="500" height="450"><path class="orbit-reveal" d="M635 246C796 199 872 350 709 480C631 543 517 578 438 589" pathLength="1" fill="none" stroke="white" stroke-width="125"/></mask></defs><g transform="translate(110 110) translate(-254 -149)"><g fill="#D9F86B"><circle cx="569" cy="207" r="58.5"/><path d="M272 549C231 502 266 455 316 405C377 351 440 309 495 290C546 270 595 279 611 313C633 360 588 416 544 456C479 509 414 549 349 581C417 511 493 422 498 380C507 322 401 365 332 413C282 456 249 513 272 549Z"/><path d="M634 246C692 218 789 235 814 291C849 372 780 454 685 511C611 555 516 582 438 589C545 559 640 526 706 469C769 413 806 347 763 289C731 250 678 239 634 246Z" mask="url(#reveal)"/></g><path d="M563 467C583 419 615 383 651 386C689 390 728 389 757 345C748 398 721 421 681 420C642 417 606 413 563 467Z" fill="#B7ACF5" class="pulse"/></g></svg>